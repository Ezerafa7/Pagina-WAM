<head>

  <title>Tutoriales WAM</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f3f8ff;

      color: #333;
    }

    header {
      text-align: center;
      padding: 2rem 1rem;

      font-size: 2.5rem;

    p.description {

      justify-content: center;

    }

    .card p {

      color: #555;

    .btn {
      display: inline-block;

      padding: 0.5rem 1rem;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .btn:hover {

    }
